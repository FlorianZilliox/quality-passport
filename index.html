<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f7f6f2">
<title>Quality Passport</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e3a900' d='M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/RethinkSans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/celebration.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<!-- Loading -->
<section id="screen-loading" class="screen" hidden>
  <div class="page center-all">
    <img class="mark pulse" data-logo alt="">
    <p id="loading-text" class="muted"></p>
  </div>
</section>

<!-- Welcome -->
<section id="screen-welcome" class="screen" hidden>
  <div class="page">
    <p class="eyebrow center" data-config="EVENT"></p>
    <img class="logo-hero rise" data-logo="full" alt="Quality Powering Performance">
    <div class="stack-8 rise d1">
      <h1 tabindex="-1" data-t="welcomeTitle"></h1>
      <p class="lead" data-t="welcomeSubtitle"></p>
    </div>
    <form id="welcome-form" class="form-bottom rise d2" novalidate>
      <label for="email" data-t="emailLabel"></label>
      <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required>
      <p id="email-error" class="field-error" aria-live="polite"></p>
      <button id="welcome-btn" class="btn" type="submit" data-t="continue"></button>
      <p class="notice" id="welcome-wait" data-t="checkingSlow" aria-live="polite" hidden></p>
      <p class="notice" data-t="emailNotice"></p>
    </form>
  </div>
</section>

<!-- Question -->
<section id="screen-question" class="screen" hidden>
  <div class="page tight-top">
    <div class="topbar">
      <button class="link" type="button" data-go="passport"><span aria-hidden="true">←</span> <span data-t="myPassport"></span></button>
      <div class="mini-stars" id="q-mini-stars" aria-hidden="true"></div>
    </div>
    <div class="pillar-head">
      <div class="ring" id="q-icon"></div>
      <div class="stack-2">
        <p class="eyebrow accent" id="q-label"></p>
        <h1 tabindex="-1" id="q-name"></h1>
      </div>
    </div>
    <form id="question-form" class="question-form" novalidate>
      <label for="answer" id="q-text" class="question-text"></label>
      <p class="muted small" data-t="questionIntro"></p>
      <textarea id="answer" rows="5"></textarea>
      <p id="answer-counter" class="counter" aria-live="polite"></p>
      <button id="submit-btn" class="btn" type="submit" disabled data-t="submit"></button>
    </form>
  </div>
</section>

<!-- Passport -->
<section id="screen-passport" class="screen" hidden>
  <div class="page">
    <div class="brand">
      <img class="mark" data-logo alt="">
      <div class="stack-2">
        <p class="eyebrow" data-config="EVENT"></p>
        <p class="program-name" data-config="PROGRAM"></p>
      </div>
    </div>
    <div class="title-row">
      <h1 tabindex="-1" data-t="passportTitle"></h1>
      <p class="count" id="p-count"></p>
    </div>
    <div class="track" id="p-path"></div>
    <div class="passport-bottom">
      <div class="earned-card" id="p-earned" hidden>
        <span class="earned-star" id="p-earned-star" aria-hidden="true"></span>
        <p class="eyebrow" id="p-earned-label"></p>
        <p class="earned-name" id="p-earned-name"></p>
      </div>
      <p class="muted center" id="p-next" data-t="nextHint" hidden></p>
      <p data-sync role="status" aria-live="polite" hidden></p>
      <div class="complete" id="p-complete" hidden>
        <p class="complete-title" data-t="completeTitle"></p>
        <p class="muted" data-t="completeSubtitle"></p>
        <button class="btn" id="p-open-celebration" type="button" data-t="openPassport"></button>
      </div>
    </div>
  </div>
</section>

<!-- Celebration -->
<section id="screen-celebration" class="screen celebration" hidden>
  <div class="page">
    <p class="eyebrow center on-dark" data-config="EVENT"></p>
    <div class="star-line" id="c-stars" aria-hidden="true"></div>
    <div class="stack-8 center reveal">
      <h1 tabindex="-1" data-t="celebrationTitle"></h1>
      <p class="lead" data-t="celebrationSubtitle"></p>
    </div>
    <div class="certificate reveal d1">
      <div class="certificate-inner">
        <img class="mark small" data-logo alt="">
        <p class="eyebrow accent" data-t="docTitle"></p>
        <p class="cert-small" data-t="docCertifies"></p>
        <p class="cert-name" id="cert-name"></p>
        <button class="text-link" id="edit-name" type="button" data-t="editName"></button>
        <div class="name-field" id="name-field" hidden>
          <label for="holder" class="visually-hidden" data-t="holderLabel"></label>
          <input id="holder" type="text" autocomplete="name" maxlength="60">
        </div>
        <p class="cert-small" id="cert-line"></p>
        <div class="cert-stars" id="cert-stars" aria-hidden="true"></div>
        <p class="cert-small" id="cert-date"></p>
      </div>
    </div>
    <div class="celebration-actions reveal d2">
      <button class="btn light" id="download-btn" type="button" data-t="download"></button>
      <div class="text-actions">
        <button class="text-link on-dark" id="share-btn" type="button" data-t="share"></button>
        <button class="text-link on-dark" id="close-btn" type="button" data-t="close"></button>
      </div>
      <p data-sync class="on-dark" role="status" aria-live="polite" hidden></p>
    </div>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Please enable JavaScript to use the Quality Passport.</p></noscript>
</body>
</html>
